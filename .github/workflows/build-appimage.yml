name: Build AppImage

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install AppImage Builder
      run: |
        python -m pip install --upgrade pip
        pip install python-appimage

    - name: Build AppImage
      run: |
        # python-appimage zabalí váš hlavní skript (změňte main.py, pokud se jmenuje jinak)
        python-appimage build script main.py
        
    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux-AppImage
        path: "*.AppImage"
