[package]
name = "calix"
version = "1.1.0"
edition = "2021"
description = "CALIX – offline calisthenics trainer (Rust desktop port)"

[dependencies]
eframe = "0.31"
egui = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = 2
