<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<meta name="description" content="CALIX – offline kalistenický trenér. Strom dovedností, knihovna, tréninky, plán, statistiky, hodnosti a úspěchy.">
<title>CALIX – offline trenér</title>
<style>
:root{
  --bg:#080c13;
  --surface:#111824;
  --surface2:#182233;
  --surface3:#202c40;
  --text:#eef3fb;
  --muted:#93a0b3;
  --line:rgba(173,194,224,.13);
  --accent:#4dabf7;
  --green:#38d9a9;
  --amber:#ffc078;
  --red:#ff6b6b;
  --radius:18px;
  --nav-h:70px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(900px 620px at 92% -8%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 62%),
    radial-gradient(700px 500px at -10% 105%, rgba(177,151,252,.13), transparent 60%),
    linear-gradient(160deg,#0b1019 0%,#070a10 58%,#0a0f17 100%);
  color:var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:15px;
  line-height:1.42;
  overscroll-behavior:none;
}
body.theme-midnight{background:linear-gradient(160deg,#06080d,#02040a 70%)}
body.theme-forest{
  background:
    radial-gradient(900px 620px at 92% -8%, rgba(56,217,169,.14), transparent 62%),
    radial-gradient(700px 500px at -10% 105%, rgba(77,171,247,.10), transparent 60%),
    linear-gradient(160deg,#09120f 0%,#050b09 58%,#07100c 100%);
}
body.theme-ember{
  background:
    radial-gradient(900px 620px at 92% -8%, rgba(255,146,43,.16), transparent 62%),
    radial-gradient(700px 500px at -10% 105%, rgba(240,101,149,.10), transparent 60%),
    linear-gradient(160deg,#150e0a 0%,#0b0705 58%,#120b07 100%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(160,180,210,.22);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

#app{
  width:100%;
  max-width:580px;
  height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  position:relative;
  background:linear-gradient(180deg,rgba(14,20,31,.82),rgba(8,12,19,.94));
  overflow:hidden;
  isolation:isolate;
}
#app:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(420px 240px at 95% 0%, color-mix(in srgb,var(--accent) 13%, transparent), transparent 70%);
}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;scrollbar-gutter:stable}
.page{padding:16px 18px 30px;animation:pageIn .2s ease both}
@keyframes pageIn{from{transform:translateY(4px)}to{transform:none}}
@media(min-width:700px){
  body{padding:20px;display:flex;align-items:center;justify-content:center}
  #app{height:min(920px,calc(100dvh - 40px));border:1px solid rgba(170,195,230,.13);border-radius:30px;box-shadow:0 34px 100px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.04) inset}
}

/* typography */
h1,h2,h3,h4,p{margin:0}
.h1{font-size:27px;line-height:1.12;font-weight:900;letter-spacing:-.7px}
.h2{font-size:20px;font-weight:850;letter-spacing:-.3px}
.h3{font-size:16px;font-weight:800;letter-spacing:-.15px}
.small{font-size:12.5px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted)}
.label{font-size:12px;font-weight:750;letter-spacing:.2px;color:var(--muted)}
.accent{color:var(--accent)}
.green{color:var(--green)}
.amber{color:var(--amber)}
.red{color:var(--red)}
.muted{color:var(--muted)}
.bold{font-weight:800}
.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}
.nowrap{white-space:nowrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{flex-wrap:wrap}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;min-height:56px;margin-bottom:10px}
.topbar .titles{flex:1;min-width:0}
.brand{font-size:22px;font-weight:950;letter-spacing:3.4px;line-height:1}
.brand .dot{color:var(--accent)}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:3px}
.backbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text);flex:none}
.backbtn:active{transform:scale(.95)}

/* cards */
.card{
  background:linear-gradient(165deg,rgba(27,38,56,.92),rgba(16,24,37,.94));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px;
  position:relative;
  overflow:hidden;
}
.card.click{transition:transform .15s ease,border-color .15s ease,background .15s ease}
.card.click:hover{border-color:rgba(190,210,240,.24)}
.card.click:active{transform:scale(.985)}
.card.accent{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 12%,transparent) inset,0 10px 28px rgba(0,0,0,.18)}
.card.flat{background:rgba(19,28,43,.55)}
.card.tight{padding:12px}
.card + .card{margin-top:0}
.stack{display:flex;flex-direction:column;gap:10px}
.stack.sm{gap:7px}
.stack.lg{gap:14px}
.section{margin-top:18px;margin-bottom:9px;display:flex;align-items:flex-end;gap:10px}
.section .sec-t{flex:1;min-width:0}
.section .sec-t .k{font-size:16px;font-weight:850;letter-spacing:-.2px}
.section .sec-t .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.link{font-size:12px;font-weight:750;color:var(--accent);background:none;border:0;padding:2px 0;white-space:nowrap;cursor:pointer}
.section .link{font-size:12px;font-weight:750;color:var(--accent);background:none;border:0;padding:2px 0;white-space:nowrap}
.divider{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.row.top{align-items:flex-start}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grow{flex:1;min-width:0}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* pills and chips */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(160,185,220,.1);border:1px solid rgba(175,200,235,.12);color:var(--muted);font-size:10.5px;font-weight:750;letter-spacing:.1px;white-space:nowrap}
.pill.filled{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent)}
.pill.green{background:rgba(56,217,169,.12);border-color:rgba(56,217,169,.22);color:var(--green)}
.pill.amber{background:rgba(255,192,120,.12);border-color:rgba(255,192,120,.22);color:var(--amber)}
.pill.red{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.22);color:var(--red)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:rgba(22,32,49,.72);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.chip.ghost{background:transparent}
.chip:active{transform:scale(.97)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:rgba(30,43,63,.8);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;line-height:1;text-decoration:none;transition:transform .13s ease,filter .13s ease;min-height:40px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#071019}
.btn.soft{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.28);color:#ff9b9b}
.btn.small{min-height:32px;padding:6px 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn.rowgrow{flex:1}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(26,38,57,.7);display:grid;place-items:center;flex:none;font-size:15px}
.iconbtn:active{transform:scale(.93)}
.fab{position:sticky;bottom:12px;float:right;margin-top:-52px;margin-right:2px;z-index:4}

/* progress */
.progress{height:8px;border-radius:999px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(175,200,235,.13);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .35s ease}
.progress.thin{height:5px}
.progress.green > i{background:var(--green)}

/* stats */
.stat{background:linear-gradient(165deg,rgba(28,40,59,.85),rgba(16,25,39,.9));border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}
.stat .v{font-size:23px;font-weight:900;letter-spacing:-.7px;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.25}
.stat .sub{font-size:10px;color:var(--muted);margin-top:2px}
.mini-bars{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:4px}
.mini-bars span{flex:1;min-width:2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 35%,transparent));border-radius:3px 3px 1px 1px;opacity:.9}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;height:84px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.heat::-webkit-scrollbar{display:none}
.heat i{width:10px;height:10px;border-radius:3px;background:rgba(150,175,210,.09);display:block}
.heat i.l1{background:color-mix(in srgb,var(--accent) 24%,rgba(150,175,210,.09))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 45%,rgba(150,175,210,.09))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 68%,rgba(150,175,210,.09))}
.heat i.l4{background:var(--accent)}

/* lists */
.listrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(170,195,230,.08)}
.listrow:last-child{border-bottom:0;padding-bottom:0}
.listrow:first-child{padding-top:0}
.listrow .main{flex:1;min-width:0}
.listrow .n{display:block;font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.chev{color:var(--muted);font-size:17px;flex:none}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.empty .ic{font-size:34px;opacity:.75;margin-bottom:6px}
.empty .t{font-size:15px;font-weight:750;color:var(--text);margin-bottom:3px}
.empty .s{font-size:12px;line-height:1.45}

/* avatar */
.avatar{display:inline-block;line-height:0;flex:none;border-radius:50%;position:relative}
.avatar svg{display:block;border-radius:50%}
.avatarpick{display:flex;flex-direction:column;align-items:center;gap:5px;width:82px;flex:none;background:none;border:0;padding:2px;border-radius:14px;color:var(--muted)}
.avatarpick .nm{font-size:10.5px;font-weight:750;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.avatarpick.locked .nm{color:var(--muted)}
.avatarpick.sel{background:color-mix(in srgb,var(--accent) 11%,transparent);outline:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.avatarpick .req{font-size:9px;color:var(--muted);max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field > label{font-size:11.5px;font-weight:750;color:var(--muted)}
input,select,textarea{width:100%;background:rgba(12,19,30,.85);border:1px solid rgba(175,200,235,.16);border-radius:12px;padding:11px 12px;color:var(--text);outline:none;min-height:42px}
input::placeholder,textarea::placeholder{color:rgba(150,165,185,.55)}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
textarea{min-height:76px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.seg{display:flex;background:rgba(10,16,26,.72);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px 8px;border-radius:9px;font-weight:750;font-size:12px}
.seg button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.search{position:relative}
.search input{padding-left:36px}
.search:before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;pointer-events:none}
.toggle{width:44px;height:26px;border-radius:999px;border:1px solid var(--line);background:rgba(120,140,165,.22);padding:2px;flex:none;transition:background .18s}
.toggle:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#dfeaff;transition:transform .18s}
.toggle.on{background:color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.toggle.on:after{transform:translateX(18px);background:#071019}
input[type=range]{padding:0;min-height:24px;accent-color:var(--accent);background:transparent;border:0;box-shadow:none}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* modal */
#modal-root{position:fixed;inset:0;z-index:80;pointer-events:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,5,10,.66);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;pointer-events:auto;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(440px,100%);max-height:min(84vh,760px);overflow-y:auto;background:linear-gradient(170deg,#182132,#0f1622);border:1px solid rgba(185,205,235,.16);border-radius:22px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal h3{font-size:17px;font-weight:850;margin-bottom:12px;letter-spacing:-.2px}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal .modal-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));transform:translate(-50%,18px);z-index:120;background:#1d2a3d;border:1px solid rgba(190,210,240,.18);color:var(--text);padding:10px 14px;border-radius:12px;font-size:12.5px;font-weight:700;max-width:min(440px,calc(100vw - 40px));text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(56,217,169,.35)}
#toast.err{border-color:rgba(255,107,107,.4)}

/* bottom navigation */
#bottom-nav{height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);display:flex;background:rgba(11,17,27,.94);border-top:1px solid var(--line);backdrop-filter:blur(18px);flex:none;z-index:20}
#bottom-nav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;font-size:10px;font-weight:750;padding:4px 0}
#bottom-nav button .ic{font-size:19px;line-height:1;filter:saturate(.6);opacity:.8}
#bottom-nav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
#bottom-nav button.on .ic{filter:none;opacity:1}
#bottom-nav button:active{transform:scale(.96)}

/* home */
.hero{display:flex;align-items:center;gap:12px}
.hero .name{font-size:25px;font-weight:950;letter-spacing:-.8px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.levelorb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:950;color:#071019;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--accent) 96%,white),color-mix(in srgb,var(--accent) 55%,#071019));box-shadow:0 0 30px color-mix(in srgb,var(--accent) 28%,transparent);flex:none}
.quick{display:flex;flex-direction:column;gap:6px;padding:13px;border-radius:15px;background:linear-gradient(165deg,rgba(26,38,57,.85),rgba(15,23,36,.9));border:1px solid var(--line);text-align:left;min-height:84px}
.quick .ic{font-size:21px}
.quick .t{font-size:13px;font-weight:800}
.quick .s{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today{display:flex;align-items:center;gap:11px}
.today .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,transparent);font-size:17px;flex:none}
.today.rest .ic{background:rgba(150,170,195,.12);color:var(--muted)}

/* skills */
.skillrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(170,195,230,.08)}
.skillrow:last-child{border-bottom:0;padding-bottom:0}
.skillrow .main{flex:1;min-width:0}
.skillrow .n{display:block;font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skillrow .s{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skillrow .acts{display:flex;gap:5px;align-items:center;flex:none}
.statusline{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.detailhead{padding:17px;border-radius:20px;background:linear-gradient(165deg,rgba(29,43,64,.96),rgba(14,22,34,.94));border:1px solid var(--line);position:relative;overflow:hidden}
.detailhead:after{content:"";position:absolute;right:-40px;top:-70px;width:170px;height:170px;border-radius:50%;background:color-mix(in srgb,var(--accent) 15%,transparent);filter:blur(4px);pointer-events:none}
.detailhead .n{font-size:25px;font-weight:950;letter-spacing:-.7px;line-height:1.12;position:relative}
.detailhead .s{font-size:12px;color:var(--muted);margin-top:5px;position:relative}
.detailhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative}
.detailhead .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;position:relative}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(170,195,230,.07);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:3px 8px;border-radius:8px;background:rgba(155,180,215,.09);border:1px solid rgba(175,200,235,.08);color:var(--muted)}
.bullets{margin:0;padding-left:17px;color:var(--muted);font-size:12.5px;line-height:1.55}
.bullets li{margin:3px 0}
.bullets li::marker{color:var(--accent)}

/* tree */
.tree-wrap{position:relative;border:1px solid var(--line);border-radius:16px;background:rgba(9,15,24,.45);overflow:hidden}
.tree-scroll{overflow:auto;max-height:68vh;scrollbar-width:thin}
.tree-canvas{position:relative;min-height:420px}
.tree-canvas svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.tree-lane{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(160,185,220,.10)}
.tree-lane-l{position:absolute;top:9px;left:12px;font-size:10px;font-weight:850;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);opacity:.8;white-space:nowrap}
.tnode{position:absolute;width:158px;min-height:58px;border-radius:13px;padding:8px 9px;background:linear-gradient(160deg,rgba(30,43,63,.96),rgba(16,25,39,.97));border:1px solid rgba(175,200,235,.14);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px;transition:transform .14s,border-color .14s}
.tnode:hover{border-color:rgba(190,215,250,.3)}
.tnode:active{transform:scale(.98)}
.tnode.done{border-color:rgba(56,217,169,.34);background:linear-gradient(160deg,rgba(24,52,48,.9),rgba(13,29,29,.95))}
.tnode.training{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.tnode.locked{opacity:.55}
.tnode .tn{font-size:11.5px;font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tnode .ts{font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.tnode .tdot{width:5px;height:5px;border-radius:50%;background:var(--muted);display:inline-block}
.tnode.done .tdot{background:var(--green)}
.tnode.training .tdot{background:var(--accent)}
.tree-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:7px}
.tree-legend span{display:inline-flex;align-items:center;gap:4px}
.tree-legend i{width:6px;height:6px;border-radius:50%;display:inline-block}

/* library */
.exrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(170,195,230,.08)}
.exrow:last-child{border-bottom:0;padding-bottom:0}
.exrow .main{flex:1;min-width:0}
.exrow .n{display:block;font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exrow .s{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{background:none;border:0;color:var(--muted);font-size:18px;padding:2px;line-height:1;flex:none}
.star.on{color:var(--amber)}

/* train */
.workoutcard{display:flex;flex-direction:column;gap:9px}
.workoutcard .top{display:flex;align-items:flex-start;gap:10px}
.workoutcard .top .main{flex:1;min-width:0}
.workoutcard .n{font-size:16px;font-weight:850;letter-spacing:-.15px}
.workoutcard .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.workoutcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.workoutcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.styleline{height:3px;border-radius:99px;width:100%}
.draftitem{border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(13,21,33,.6)}
.draftitem .num{width:24px;height:24px;border-radius:8px;background:rgba(155,180,215,.1);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.draftitem .name{font-size:12.5px;font-weight:750;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draftitem .inputs{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;margin-top:8px}
.draftitem .inputs label{font-size:9.5px;color:var(--muted);display:block;margin-bottom:2px}
.draftitem .inputs input{min-height:34px;padding:6px 8px;border-radius:8px;font-size:12px}
.schedule-day{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.schedule-day::-webkit-scrollbar{display:none}
.daybtn{width:54px;flex:none;border:1px solid var(--line);background:rgba(20,30,46,.7);border-radius:13px;padding:7px 3px;text-align:center;color:var(--muted)}
.daybtn .d{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px}
.daybtn .n{display:block;font-size:18px;font-weight:900;margin-top:1px;color:var(--text)}
.daybtn.today{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.daybtn .dot{display:block;width:5px;height:5px;margin:4px auto 0;background:var(--accent)}
.occ{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(170,195,230,.08)}
.occ:last-child{border-bottom:0}
.occ .date{width:42px;flex:none;text-align:center;background:rgba(155,180,215,.08);border-radius:10px;padding:5px 2px}
.occ .date .d{font-size:15px;font-weight:900;line-height:1}
.occ .date .m{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.occ .main{flex:1;min-width:0}
.occ .n{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.occ .s{font-size:10.5px;color:var(--muted)}
.occ.rest{opacity:.72}

/* active session */
.sessionhead{display:flex;align-items:center;gap:12px}
.sessionhead .time{font-size:22px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.restbar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:14px;padding:10px 12px;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
.restbar .t{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent)}
.exblock{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(13,21,33,.55)}
.exblock .hd{display:flex;align-items:center;gap:8px;padding:11px 12px;background:rgba(30,44,64,.5);border-bottom:1px solid var(--line)}
.exblock .hd .n{font-size:13px;font-weight:800;flex:1}
.exblock .hd .c{font-size:10.5px;color:var(--muted)}
.setrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(170,195,230,.06)}
.setrow:last-child{border-bottom:0}
.setrow .idx{width:22px;font-size:10.5px;color:var(--muted);flex:none}
.setrow .inp{display:flex;align-items:center;gap:4px;flex:1}
.setrow input{width:70px;min-height:34px;padding:5px 8px;border-radius:8px;font-size:12px;text-align:center}
.setrow .unit{font-size:10px;color:var(--muted);width:22px}
.setrow .chk{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(20,31,47,.7);color:var(--muted);display:grid;place-items:center;flex:none;font-size:15px}
.setrow.done .chk{background:rgba(56,217,169,.16);border-color:rgba(56,217,169,.4);color:var(--green)}
.setrow.done input{opacity:.6}
.setrow .rest{font-size:9.5px;color:var(--muted);flex:none;width:38px;text-align:right}

/* ranks / achievements */
.rankrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(170,195,230,.08)}
.rankrow:last-child{border-bottom:0;padding-bottom:0}
.rankbadge{width:38px;height:38px;border-radius:12px;background:rgba(155,180,215,.1);display:grid;place-items:center;font-size:14px;font-weight:950;flex:none}
.rankrow .main{flex:1;min-width:0}
.rankrow .n{display:block;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankrow .s{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.rankrow .more{font-size:11px;color:var(--accent);font-weight:750;background:none;border:0;flex:none}
.achcard{display:flex;gap:11px;padding:12px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(165deg,rgba(26,38,57,.7),rgba(14,22,34,.78));position:relative;overflow:hidden}
.achcard.unlocked{border-color:rgba(56,217,169,.3)}
.achcard .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:rgba(155,180,215,.09);flex:none}
.achcard.unlocked .ic{background:rgba(56,217,169,.14)}
.achcard .main{flex:1;min-width:0}
.achcard .n{font-size:13px;font-weight:800;line-height:1.25}
.achcard .d{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.achcard .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.achcard .xp{font-size:10px;color:var(--amber);font-weight:750}

/* profile */
.profilehead{display:flex;align-items:center;gap:14px}
.profilehead .main{flex:1;min-width:0}
.profilehead .n{font-size:24px;font-weight:950;letter-spacing:-.7px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profilehead .t{font-size:12px;color:var(--muted);margin-top:3px}
.cosmetic{width:132px;flex:none;border-radius:14px;border:1px solid var(--line);padding:10px;background:rgba(18,27,42,.75);text-align:left;color:var(--text)}
.cosmetic .nm{font-size:12px;font-weight:750;display:flex;align-items:center;gap:5px}
.cosmetic .ds{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cosmetic.sel{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,rgba(18,27,42,.75))}
.cosmetic.locked{opacity:.65}
.colorpick{width:40px;height:40px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;flex:none;color:#071019;font-weight:950;font-size:16px}
.colorpick.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2)}

/* settings */
.settingrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(170,195,230,.08)}
.settingrow:last-child{border-bottom:0;padding-bottom:0}
.settingrow .main{flex:1;min-width:0}
.settingrow .n{font-size:13px;font-weight:750}
.settingrow .s{font-size:10.5px;color:var(--muted);margin-top:2px}
.menurow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(170,195,230,.08);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--text)}
.menurow:last-child{border-bottom:0;padding-bottom:0}
.menurow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(155,180,215,.09);font-size:16px;flex:none}
.menurow .main{flex:1;min-width:0}
.menurow .n{display:block;font-size:13px;font-weight:750}
.menurow .s{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* misc */
.kbd{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 4px;color:var(--muted)}
.warning{background:rgba(255,192,120,.09);border:1px solid rgba(255,192,120,.22);color:#ffd7a8;border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.45}
.success{background:rgba(56,217,169,.08);border:1px solid rgba(56,217,169,.2);color:#9ff0d5;border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.45}
.pb{margin-top:9px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--muted)}
@media(max-width:370px){
  .page{padding-left:14px;padding-right:14px}
  .h1{font-size:24px}
  .grid3{grid-template-columns:1fr 1fr}
  .stat .v{font-size:20px}
}

/* first-run onboarding */
.page.onboarding{padding-top:22px;min-height:100vh;display:flex;flex-direction:column}
.onboard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.onboard-top .brand{font-size:20px;font-weight:950;letter-spacing:-.7px}
.onboard-top .brand .dot{color:var(--accent)}
.onboard-step{font-size:11px;color:var(--muted);font-weight:750;letter-spacing:.3px}
.onboard-progress{display:flex;gap:5px;margin-bottom:24px}
.onboard-progress span{height:4px;flex:1;border-radius:999px;background:rgba(150,175,210,.16);transition:background .2s}
.onboard-progress span.on{background:var(--accent)}
.onboard-hero{text-align:center;padding:10px 0 22px}
.onboard-mark{width:74px;height:74px;border-radius:22px;margin:0 auto 16px;display:grid;place-items:center;font-size:34px;font-weight:950;letter-spacing:-2px;color:#071019;background:linear-gradient(145deg,var(--accent),#b197fc);box-shadow:0 18px 45px color-mix(in srgb,var(--accent) 22%,transparent)}
.onboard-mark span{color:#fff;opacity:.8}
.onboard-kicker{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--accent);margin-bottom:5px}
.onboard-title{font-size:27px;line-height:1.08;font-weight:950;letter-spacing:-.9px;margin-bottom:7px}
.onboard-sub{font-size:13px;color:var(--muted);line-height:1.5;max-width:330px;margin:0 auto 18px}
.onboard-card{border:1px solid var(--line);background:linear-gradient(165deg,rgba(26,38,57,.72),rgba(14,22,34,.82));border-radius:20px;padding:16px;box-shadow:0 18px 45px rgba(0,0,0,.18)}
.onboard-choices{display:flex;flex-direction:column;gap:8px;margin-top:17px}
.onboard-choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--text);border:1px solid var(--line);background:rgba(19,28,43,.72);border-radius:16px;padding:13px;transition:border-color .15s,background .15s,transform .15s}
.onboard-choice:active{transform:scale(.99)}
.onboard-choice.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 11%,rgba(19,28,43,.72))}
.onboard-choice .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(155,180,215,.1);color:var(--accent);font-size:16px;flex:none}
.onboard-choice .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.onboard-choice .n{font-size:14px;font-weight:800}
.onboard-choice .s{font-size:11px;color:var(--muted);line-height:1.4}
.onboard-choice .check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--accent);font-size:12px;flex:none}
.onboard-choice.on .check{background:var(--accent);border-color:var(--accent);color:#071019}
.onboard-recommend{display:flex;align-items:center;gap:13px;border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);background:color-mix(in srgb,var(--accent) 9%,rgba(19,28,43,.72));border-radius:18px;padding:15px;margin-top:20px}
.onboard-recommend-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:#071019;font-size:17px;flex:none}
.onboard-recommend .main{flex:1;min-width:0}
.onboard-recommend .h3{font-size:16px;font-weight:850;margin-top:2px}
.onboard-summary{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px;color:var(--muted);font-size:11px;font-weight:700}
.onboard-actions{margin-top:auto;padding-top:24px}
.onboard-skip{display:block;margin:11px auto 0;color:var(--muted)}
.backup-info{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding:8px 10px;border-radius:10px;background:rgba(155,180,215,.07);font-size:10.5px;color:var(--muted)}
.reminder-status{margin-top:9px;padding:9px 10px;border-radius:10px;background:rgba(155,180,215,.07);border:1px solid rgba(155,180,215,.1);font-size:11px;color:var(--muted);line-height:1.4}
.reminder-status.on{color:#9ff0d5;background:rgba(56,217,169,.08);border-color:rgba(56,217,169,.18)}
.reminder-days{flex-wrap:wrap;overflow:visible}
.reminder-days .chip{min-width:38px;text-align:center;justify-content:center}
.settingrow input[type=time]{width:118px;min-height:36px;padding:6px 8px;flex:none}
@media(max-width:370px){
  .onboard-title{font-size:24px}
  .onboard-card{padding:13px}
}

/* ---------- coach ---------- */
.coach-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.coach-face{display:inline-flex;flex:none;color:var(--accent)}
.coach-name{font-size:17px;font-weight:900;letter-spacing:-.2px}
.coach-status{font-size:11px;font-weight:750;color:var(--green);margin:2px 0}
.coach-lvl{flex:none;text-align:center;padding:5px 10px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.coach-lvl b{display:block;font-size:17px;font-weight:900;color:var(--accent);line-height:1.1}
.coach-lvl span{font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.coach-chat{padding:11px}
.coach-feed{display:flex;flex-direction:column;gap:9px;max-height:min(50vh,440px);overflow-y:auto;padding:2px 2px 8px}
.coach-row{display:flex;gap:8px;align-items:flex-start}
.coach-row.you{justify-content:flex-end}
.coach-bubble{max-width:82%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.coach-row.you .coach-bubble{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.coach-confirm{margin-left:42px;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:14px;padding:10px}
.coach-confirm .t{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.coach-chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 6px;scrollbar-width:none}
.coach-chips::-webkit-scrollbar{display:none}
.coach-composer{display:flex;gap:8px;align-items:stretch}
.coach-composer input{flex:1;min-width:0}

sh","tier":1,"prereqs":["pushup"],"description":"Hands close under the chest. Shifts load toward triceps and inner chest.","steps":["Close-grip push-ups","Thumbs and index fingers touching","Keep elbows tucked and shoulders packed"],"exercises":["3 x 6-10 diamond push-ups","2 x 10 close-grip push-ups"],"regressions":["Close-grip push-ups","Incline diamond push-ups"],"unit":"reps","target":15,"note":""},{"id":"decline_pushup","name":"Decline Push-Up","category":"push","tier":1,"prereqs":["pushup"],"description":"Feet elevated to shift load onto the shoulders. The key bridge toward handstand and planche work.","steps":["Feet on a low step","Feet at knee height","Feet at hip height or higher"],"exercises":["3 x 8-12 decline push-ups","3 x 5 slow negatives"],"regressions":["Lower the feet elevation"],"unit":"reps","target":15,"note":""},{"id":"pike_pushup","name":"Pike Push-Up","category":"push","tier":1,"prereqs":["pushup"],"description":"Hips high, head travelling between the hands. A vertical-press pattern that builds handstand push-up strength.","steps":["Floor pike push-ups","Feet elevated on a box","Head travels forward past the hands"],"exercises":["3 x 6-10 pike push-ups","3 x 20 s pike holds"],"regressions":["Hands-elevated pike push-ups"],"unit":"reps","target":12,"note":""},{"id":"dip","name":"Parallel Bar Dip","category":"push","tier":1,"prereqs":["pushup","support_hold"],"description":"Pressing between parallel bars. Builds chest, triceps and shoulders; essential for muscle-ups and planche.","steps":["Bar support hold","Bench dips or box-assisted dips","Slow negatives","Full-depth dips"],"exercises":["4 x 5-10 dips","3 x 5 negatives (4 s down)"],"regressions":["Bench dips","Band-assisted dips","Negative-only dips"],"unit":"reps","target":12,"note":"Don't bounce out of the bottom, and stop if the front of the shoulder hurts."},{"id":"archer_pushup","name":"Archer Push-Up","category":"push","tier":2,"prereqs":["diamond_pushup","decline_pushup"],"description":"Wide push-up shifting weight to one arm while the other stays straight. The bridge to one-arm push-ups.","steps":["Wide push-ups","Side-to-side shifts at the bottom","Archer push-ups with a towel-assisted straight arm"],"exercises":["3 x 4-6 per side"],"regressions":["Wide push-up shifts","Band- or towel-assisted archers"],"unit":"reps","target":8,"note":""},{"id":"one_arm_pushup","name":"One-Arm Push-Up","category":"push","tier":3,"prereqs":["archer_pushup"],"description":"Elite unilateral push demanding huge pressing strength and anti-rotation control.","steps":["Archer push-ups with minimal assist","Elevated one-arm negatives","One-arm push-up with wide feet"],"exercises":["5 x 2-3 per side","Elevated one-arm push-ups"],"regressions":["Elevated one-arm push-ups","Archer push-ups"],"unit":"reps","target":3,"note":""},{"id":"planche_lean","name":"Planche Lean","category":"push","tier":1,"prereqs":["pushup"],"description":"Straight-arm plank with the shoulders pushed forward past the hands. Entry point to planche training.","steps":["Plank leaning a little forward","Increase the lean until shoulders are well over the hands","Hold with protracted shoulders and posterior pelvic tilt"],"exercises":["4 x 15-20 s planche leans"],"regressions":["Shallower lean angle"],"unit":"s","target":20,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"pseudo_planche_pushup","name":"Pseudo Planche Push-Up","category":"push","tier":2,"prereqs":["planche_lean","decline_pushup"],"description":"Push-ups with hands by the hips and a forward lean. Builds dynamic planche strength.","steps":["Hands at the lower ribs","Hands at the hips, deeper lean","Add a hollow body line"],"exercises":["4 x 5-8 pseudo planche push-ups"],"regressions":["Less lean","Hands higher up the torso"],"unit":"reps","target":8,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"tuck_planche","name":"Tuck Planche","category":"push","tier":2,"prereqs":["planche_lean","dip"],"description":"Feet off the floor, knees tucked tight to the chest, arms straight.","steps":["Planche lean with one foot lifting","Tuck hold on parallettes","Round upper back, protract shoulders"],"exercises":["5 x 5-10 s tuck holds","Tuck planche leans"],"regressions":["Planche lean with toes touching","Band-assisted tuck planche"],"unit":"s","target":10,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"adv_tuck_planche","name":"Advanced Tuck Planche","category":"push","tier":2,"prereqs":["tuck_planche","pseudo_planche_pushup"],"description":"Back flat and hips level with the shoulders, knees still bent.","steps":["Tuck planche with hips rising","Flat-back tuck","Hold with hips at shoulder height"],"exercises":["5 x 5-8 s advanced tuck holds"],"regressions":["Regular tuck planche"],"unit":"s","target":10,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"straddle_planche","name":"Straddle Planche","category":"push","tier":3,"prereqs":["adv_tuck_planche"],"description":"Legs straight and spread wide, body parallel to the floor.","steps":["Advanced tuck with one leg extended","Wide straddle with bent hips","Straight legs with a flat body"],"exercises":["5 x 3-6 s straddle holds","Straddle planche negatives"],"regressions":["One-leg-extended variations","Band-assisted straddle planche"],"unit":"s","target":8,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"full_planche","name":"Full Planche","category":"push","tier":3,"prereqs":["straddle_planche"],"description":"The iconic skill: body horizontal, legs together, supported on straight arms.","steps":["Narrow the straddle gradually","Half-straddle holds","Legs together"],"exercises":["5 x 2-5 s holds","Planche leans for volume"],"regressions":["Narrower straddle planche","Band-assisted planche"],"unit":"s","target":5,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"wall_hspu","name":"Wall Handstand Push-Up","category":"push","tier":2,"prereqs":["pike_pushup","wall_handstand"],"description":"Vertical pressing against a wall.","steps":["Pike push-ups with feet elevated","Box-assisted wall HSPU","Full-depth wall HSPU"],"exercises":["4 x 3-6 wall HSPU","3 x 3 negatives (4 s down)"],"regressions":["Pike push-ups on a box","Negative-only wall HSPU"],"unit":"reps","target":5,"note":"Use a mat, and learn how to bail safely out of a handstand before you train this."},{"id":"free_hspu","name":"Freestanding Handstand Push-Up","category":"push","tier":3,"prereqs":["wall_hspu","free_handstand"],"description":"Handstand push-ups with no wall. Strength and balance combined.","steps":["Wall HSPU with fingertips-only balance","Short-range freestanding dips","Full-depth freestanding HSPU"],"exercises":["5 x 1-3 reps","Freestanding handstand dips"],"regressions":["Wall HSPU","Short-range handstand dips"],"unit":"reps","target":3,"note":""},{"id":"inverted_row","name":"Inverted Row","category":"pull","tier":0,"prereqs":[],"description":"Horizontal pulling under a bar or rings. The base of all pulling strength.","steps":["Bent-knee rows with a high bar","Straight-body rows","Feet elevated rows"],"exercises":["3 x 8-12 inverted rows","2 x 20 s top-position hold"],"regressions":["Bend the knees and walk the feet closer"],"unit":"reps","target":12,"note":""},{"id":"chinup","name":"Chin-Up","category":"pull","tier":0,"prereqs":["inverted_row","dead_hang"],"description":"Palms facing you. The biceps help a lot, so it's the usual first vertical pull.","steps":["Band-assisted chin-ups","Slow negatives (4-5 s)","Full chin-ups"],"exercises":["5 x 2-4 negatives","3 x max-minus-2 chin-ups"],"regressions":["Band-assisted chin-ups","Jumping negatives"],"unit":"reps","target":8,"note":""},{"id":"pullup","name":"Pull-Up","category":"pull","tier":1,"prereqs":["inverted_row","dead_hang"],"description":"Overhand grip, chin over the bar, no kipping. The cornerstone of nearly every advanced pulling skill.","steps":["Scapular pulls","Negatives (4-5 s)","Band-assisted pull-ups","Strict pull-ups"],"exercises":["5 x 3-5 negatives","4 x 3-8 pull-ups"],"regressions":["Band-assisted pull-ups","Inverted rows","Negatives"],"unit":"reps","target":10,"note":""},{"id":"wide_pullup","name":"Wide Pull-Up","category":"pull","tier":1,"prereqs":["pullup"],"description":"Wider grip, more lat emphasis, and a smaller range of motion that's harder at the top.","steps":["Shoulder-width pull-ups","Slightly wider than shoulders","Wide grip to the chest"],"exercises":["4 x 4-8 wide pull-ups"],"regressions":["Regular pull-ups"],"unit":"reps","target":8,"note":""},{"id":"archer_pullup","name":"Archer Pull-Up","category":"pull","tier":2,"prereqs":["wide_pullup"],"description":"Pull to one side while the opposite arm stays extended. Builds toward the one-arm pull-up.","steps":["Wide pull-ups","Typewriter holds side to side","Archer pull-ups"],"exercises":["4 x 3-5 per side"],"regressions":["Typewriter pull-ups","Band-assisted archers"],"unit":"reps","target":5,"note":""},{"id":"one_arm_pullup","name":"One-Arm Pull-Up","category":"pull","tier":3,"prereqs":["archer_pullup"],"description":"One of the rarest strength skills in calisthenics.","steps":["Archer pull-ups with a free hand lightly assisting","One-arm negatives","Assisted-wrist one-arm pull-up","Full one-arm pull-up"],"exercises":["5 x 1-3 negatives (5-8 s)","Assisted one-arm pull-ups"],"regressions":["Archer pull-ups","One-arm negatives"],"unit":"reps","target":1,"note":"High elbow and biceps tendon stress. Don't rush."},{"id":"c2b_pullup","name":"Chest-to-Bar Pull-Up","category":"pull","tier":2,"prereqs":["pullup"],"description":"Pulling high enough to touch your chest to the bar. A key stepping stone to the muscle-up.","steps":["Explosive pull-ups","Pull-ups to the sternum","Chest-to-bar with a hollow position"],"exercises":["5 x 3-5 high pulls","3 x 3 explosive pull-ups"],"regressions":["Explosive pull-ups","Band-assisted chest-to-bar"],"unit":"reps","target":5,"note":""},{"id":"bar_muscle_up","name":"Bar Muscle-Up","category":"pull","tier":2,"prereqs":["c2b_pullup","dip"],"description":"Pull over the bar into a dip support. Combines explosive pulling, the transition and pressing.","steps":["Chest-to-bar pull-ups","Low-bar transitions","Band-assisted muscle-up","Strict muscle-up"],"exercises":["5 x 1-3 muscle-ups","Low-bar muscle-ups","Straight-bar dips"],"regressions":["Low-bar muscle-ups","Band-assisted muscle-ups"],"unit":"reps","target":3,"note":"A rushed transition can strain shoulders and elbows. Learn it slowly."},{"id":"ring_muscle_up","name":"Ring Muscle-Up","category":"pull","tier":3,"prereqs":["bar_muscle_up","ring_support"],"description":"The same movement on unstable rings, with a false grip and a more demanding transition.","steps":["False-grip hangs and rows","Low-ring transitions","Band-assisted ring muscle-up","Full ring muscle-up"],"exercises":["5 x 1-3 ring muscle-ups","False-grip pull-ups"],"regressions":["Low ring muscle-ups","Band-assisted ring muscle-ups"],"unit":"reps","target":3,"note":""},{"id":"skin_the_cat","name":"Skin the Cat","category":"pull","tier":1,"prereqs":["pullup","hollow_hold"],"description":"Rotate through the bar from hang to an inverted hang. Builds shoulder mobility for the back lever.","steps":["Tuck knees to chest and rotate halfway","Rotate to a deep inverted hang","Return slowly"],"exercises":["3 x 3-5 slow skin-the-cats"],"regressions":["Partial rotations with feet on the floor"],"unit":"reps","target":5,"note":"Go slow through the deep shoulder-extension position."},{"id":"tuck_back_lever","name":"Tuck Back Lever","category":"pull","tier":2,"prereqs":["skin_the_cat"],"description":"Facing the floor with knees tucked, hips level with the shoulders.","steps":["Skin the cat with hold at inversion","Tuck hold with hips high","Hips and shoulders level"],"exercises":["5 x 5-10 s tuck holds"],"regressions":["Skin the cat holds","Band-assisted tuck back lever"],"unit":"s","target":10,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"straddle_back_lever","name":"Straddle Back Lever","category":"pull","tier":2,"prereqs":["tuck_back_lever"],"description":"Legs spread and straight, body horizontal.","steps":["Advanced tuck","One leg extended","Straddle hold"],"exercises":["5 x 5-8 s holds"],"regressions":["Advanced tuck back lever"],"unit":"s","target":8,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"full_back_lever","name":"Full Back Lever","category":"pull","tier":3,"prereqs":["straddle_back_lever"],"description":"A straight, horizontal body with legs together, facing the floor.","steps":["Narrow the straddle","Half-straddle","Full back lever"],"exercises":["5 x 3-6 s holds","Back lever negatives"],"regressions":["Narrower straddle back lever"],"unit":"s","target":5,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"tuck_front_lever","name":"Tuck Front Lever","category":"pull","tier":2,"prereqs":["pullup","hollow_hold"],"description":"Horizontal body facing up, knees tucked. A big step up in straight-arm pulling strength.","steps":["Hanging hollow body hold","Tuck hold with a flat back","Hips and shoulders level"],"exercises":["5 x 5-10 s tuck holds","Inverted rows with a hollow body"],"regressions":["Hanging tuck raises","Band-assisted tuck front lever"],"unit":"s","target":10,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"adv_tuck_front_lever","name":"Advanced Tuck Front Lever","category":"pull","tier":2,"prereqs":["tuck_front_lever"],"description":"Back flat, knees pulled in but hips extended.","steps":["Tuck front lever","Open the hip angle slowly","Flat-back tuck"],"exercises":["5 x 5-8 s holds"],"regressions":["Tuck front lever"],"unit":"s","target":8,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"straddle_front_lever","name":"Straddle Front Lever","category":"pull","tier":3,"prereqs":["adv_tuck_front_lever"],"description":"Legs straight and spread, body horizontal.","steps":["Advanced tuck with one leg extended","Wide straddle","Narrower straddle"],"exercises":["5 x 3-6 s holds","Front lever negatives"],"regressions":["One-leg extended front lever","Band-assisted straddle"],"unit":"s","target":6,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"full_front_lever","name":"Full Front Lever","category":"pull","tier":3,"prereqs":["straddle_front_lever"],"description":"Fully straight, horizontal body facing up, legs together.","steps":["Narrow the straddle","Half-straddle","Full lever"],"exercises":["5 x 2-5 s holds","Front lever raises"],"regressions":["Narrower straddle front lever"],"unit":"s","target":5,"note":"Straight-arm strength work loads the elbows, biceps tendons and wrists heavily. Warm up thoroughly and add volume slowly over weeks and months."},{"id":"l_sit_pullup","name":"L-Sit Pull-Up","category":"pull","tier":2,"prereqs":["pullup","l_sit"],"description":"Pull-ups with legs held straight out in front. Strong pulling plus core compression.","steps":["Knee-tuck pull-ups","One-leg-extended pull-ups","Full L-sit pull-up"],"exercises":["4 x 3-6 L-sit pull-ups"],"regressions":["Tucked pull-ups"],"unit":"reps","target":6,"note":""},{"id":"dead_hang","name":"Dead Hang","category":"static","tier":0,"prereqs":[],"description":"Hanging from a bar. Builds grip strength and shoulder tolerance for everything on the bar.","steps":["Hang for 10 s","Add time gradually","Use a thumbless grip for variety"],"exercises":["3 x 20-30 s hangs"],"regressions":["Feet-assisted hang"],"unit":"s","target":30,"note":""},{"id":"support_hold","name":"Parallel Bar Support","category":"static","tier":0,"prereqs":[],"description":"Arms locked out on parallel bars with the shoulders pushed down. The start of dips and L-sits.","steps":["Hold at 10 s","Depress shoulders actively","Hold with legs lifted"],"exercises":["4 x 20-30 s support holds"],"regressions":["Feet-assisted support on a bench"],"unit":"s","target":30,"note":""},{"id":"side_plank","name":"Side Plank","category":"static","tier":0,"prereqs":[],"description":"Lateral core stability. The base for flag skills.","steps":["Side plank on the knees","Full side plank","Add a top-leg lift"],"exercises":["3 x 30-45 s per side"],"regressions":["Knees-down side plank"],"unit":"s","target":45,"note":""},{"id":"active_hang","name":"Active Hang","category":"static","tier":1,"prereqs":["dead_hang"],"description":"A hang with the shoulders pulled down and away from the ears. Primes the scapular strength used in levers and pull-ups.","steps":["Passive dead hang","Shrug shoulders away from the ears","Hold with a hollow body"],"exercises":["4 x 15-30 s active hangs"],"regressions":["Feet-assisted active hang"],"unit":"s","target":30,"note":""},{"id":"ring_support","name":"Ring Support Hold","category":"static","tier":1,"prereqs":["support_hold"],"description":"Support on unstable rings. Required for ring dips and muscle-ups.","steps":["Rings at hip height","Straight arms with locked elbows","Turn hands outward (RTO)"],"exercises":["4 x 15-30 s ring support holds"],"regressions":["Parallel-bar support"],"unit":"s","target":30,"note":""},{"id":"clutch_flag","name":"Clutch Flag","category":"static","tier":2,"prereqs":["side_plank","pullup"],"description":"A beginner flag variation: hold a vertical pole with a 'clutch' while the legs lean out sideways.","steps":["Side plank","Hold a pole in a clutch grip","Hips lift and body stays horizontal"],"exercises":["5 x 3-8 s per side"],"regressions":["Pole side-plank leans"],"unit":"s","target":10,"note":"Take care of the spine and ribs. Use a stable pole and a spotter or mat."},{"id":"straddle_flag","name":"Straddle Human Flag","category":"static","tier":3,"prereqs":["clutch_flag"],"description":"Body fully horizontal with legs split, both hands gripping the pole.","steps":["Clutch flag","One leg straight","Both legs in a straddle"],"exercises":["5 x 3-6 s per side"],"regressions":["Clutch flag"],"unit":"s","target":6,"note":"Heavy shoulder, oblique and spine loading. Take it slowly."},{"id":"human_flag","name":"Human Flag","category":"static","tier":3,"prereqs":["straddle_flag"],"description":"Body horizontal and legs together, held off a vertical pole by the arms.","steps":["Straddle flag","Bring legs closer","Full flag"],"exercises":["5 x 2-5 s per side","Flag negatives"],"regressions":["Straddle flag"],"unit":"s","target":5,"note":"Heavy shoulder, oblique and spine loading. Take it slowly."},{"id":"plank","name":"Plank","category":"core","tier":0,"prereqs":[],"description":"The foundation of trunk stiffness. Squeeze glutes, ribs down, neutral spine.","steps":["Hold 20 s","Build to 60 s","Add a long-lever plank"],"exercises":["3 x 30-60 s planks"],"regressions":["Knee plank"],"unit":"s","target":60,"note":""},{"id":"hollow_hold","name":"Hollow Body Hold","category":"core","tier": function normalizeProfile(p, slot) {

function normalizeState(raw) {

  const arr = Array.isArray(raw.profiles) ? raw.profiles : [];
  for (let i = 0; i < 3; i++) profiles[i] = normalizeProfile(arr[i], i + 1);
  if (!profiles.some(Boolean)) profiles[0] = newProfile(1, "Hráč 1");
  let active = Number(raw.active) || 1;
  if (active < 1 || active > 3 || !profiles[active - 1]) active = profiles.findIndex(Boolean) + 1;
  const prefs = Object.assign(defaultState().prefs, raw.prefs || {});
  prefs.lang = prefs.lang === "en" ? "en" : "cs";

    return { savedAt: b.savedAt || "", reason: b.reason || "", size: raw.length };
  } catch (e) {

function createLocalBackup(reason) {
  try {
    const backup = {
      app: "calix",
      format: "calix-local-backup",
      version: 1,
      savedAt: nowISO(),
      reason: reason || "manual",
      state: JSON.parse(JSON.stringify(state))
    };
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(backup));
    _backupCheckedAt = Date.now();
    return backup;
  } catch (e) {
    console.warn("CALIX: lokální zálohu nelze vytvořit.", e);
    return null;
  }

function maybeAutoBackup() {

  _backupCheckedAt = now;
  const info = localBackupInfo();
  if (info) {
    const age = Date.now() - Date.parse(info.savedAt || 0);
    if (Number.isFinite(age) && age < AUTO_BACKUP_MS) return;
  }
  createLocalBackup("auto");
}

function restoreLocalBackup() {

  }
}

function levelNeed(level) {

  let level = 1, remaining = totalXp;
  while (level < PROG.maxLevel && remaining >= levelNeed(level)) {
    remaining -= levelNeed(level);
    level++;
  }
  let title = PROG.titles[0] || { level: 1, title: "Beginner", color: "#9aa4b2" };
  for (const t of PROG.titles) if (level >= t.level) title = t;
  const needed = levelNeed(level);
  return {
    level, total: totalXp, title: title.title, color: title.color,
    intoLevel: remaining, needed, remaining: Math.max(0, needed - remaining),

}

const skillDepths = {};

/* ---------- exercise performance / ranks ---------- */
const rankGroupOverride = {
  bar_muscle_up: "pulling", mu_transition: "pulling", skin_the_cat: "pulling",
  handstand_kickup: "static", wall_hspu: "pushing", free_hspu: "pushing",
  ring_muscle_up: "pulling", press_handstand: "static", clap_pushup: "pushing",
  burpee: "core", jump_squat: "legs", jump_lunge: "legs", box_jump: "legs", tuck_jump: "legs"

const categoryGroup = {
  push: "pushing", pull: "pulling", core: "core", legs: "legs",
  static: "static", balance: "static", skill: "static", explosive: "legs"
};
function groupForExercise(e) {
  if (rankGroupOverride[e.id]) return rankGroupOverride[e.id];
  if (e.kind === "hold" && ["pull", "push", "skill", "balance", "static"].includes(e.category)) return "static";
  return categoryGroup[e.category] || "core";
}
function roundInt(v) { return Math.round(v + 1e-9); }

  const out = [];
  for (const f of fractions) {
    let v = integer ? Math.max(1, roundInt(top * f)) : Math.round(top * f * 100) / 100;
    if (out.length && v <= out[out.length - 1]) v = out[out.length - 1] + (integer ? 1 : 0.05);
    out.push(v);
  }
  return out;
}
let _tracks = null;
const skillExerciseMapCache = {};
function skillExerciseMap() {
  if (Object.keys(skillExerciseMapCache).length) return skillExerciseMapCache;
  for (const e of EXERCISES) {
    if (!e.skill_id || !SKILL_BY_ID[e.skill_id]) continue;
    const sk = SKILL_BY_ID[e.skill_id];
    const kind = sk.unit === "reps" ? "reps" : (sk.unit === "s" || sk.unit === "sec" ? "hold" : "");
    if (kind && e.kind === kind) {
      if (!skillExerciseMapCache[e.skill_id]) skillExerciseMapCache[e.skill_id] = [];
      skillExerciseMapCache[e.skill_id].push(e.id);
    }
  }
  return skillExerciseMapCache;
}
function rankTracks() {
  if (_tracks) return _tracks;
  const out = [];
  for (const e of EXERCISES) {
    const top = CAT.ranks.tops[e.id];
    if (top == null) continue;
    out.push({
      id: e.id, name: e.name, group: groupForExercise(e), metric: "single", kind: e.kind,
      thresholds: makeThresholds(top, CAT.ranks.singleFractions, true),
      exerciseId: e.id, steps: [], difficulty: e.difficulty,
      unit: e.kind === "reps" ? "opakování" : "s"
    });
  }
  for (const line of CAT.ranks.lines) {
    if (!(line.steps || []).every(s => EX_BY_ID[s.exerciseId])) continue;
    const steps = line.steps.map(s => {
      const ex = EX_BY_ID[s.exerciseId];
      return { exerciseId: s.exerciseId, need: Number(s.need) || 0, name: ex.name, unit: ex.kind === "reps" ? "opakování" : "s" };
    });
    out.push({
      id: line.id, name: line.name, group: line.group, metric: "line", kind: "line",
      thresholds: makeThresholds(steps.length, CAT.ranks.lineFractions, false),
      exerciseId: "", steps, difficulty: Math.max(...steps.map(x => (EX_BY_ID[x.exerciseId] || {}).difficulty || 0)),

}
function rankFor(thresholds, value) { return thresholds.filter(t => value >= t).length; }
function rankName(i) { return enMode() ? (EN_RANKS[i] || EN_RANKS[0]) : (T.rank[i] || T.rank[0]); }

function rankEvents(p) {
  const out = [];

    if (!perf.exerciseId) continue;
    out.push({ date: String(perf.logged || "").slice(0, 10), exerciseId: perf.exerciseId, value: Number(perf.value) || 0 });
  }
  const map = skillExerciseMap();
  for (const [skillId, recs] of Object.entries(p.records || {})) {
    for (const r of (recs || [])) {
      for (const ex of (map[skillId] || [])) {
        out.push({ date: String(r.logged || "").slice(0, 10), exerciseId: ex, value: Number(r.value) || 0 });
      }
    }
  }
  for (const s of (p.sessions || [])) {
    for (const set of (s.sets || [])) {
      if (!set.done) continue;
      const value = set.kind === "reps" ? Number(set.reps) || 0 : Number(set.hold) || 0;
      if (value > 0) out.push({ date: String(s.date || "").slice(0, 10), exerciseId: set.exerciseId, value });

  });

}

}

/* ---------- stats ---------- */
function completedSessions(p) {

}
function dayCounts(p) {

}
function completion(p) {
  const sets = sessionSets(p, false);

}
function personalRecords(p) {
  const by = {};
  for (const { session, set } of sessionSets(p, true)) {
    if (!set.exerciseId) continue;
    const val = set.kind === "reps" ? Number(set.reps) || 0 : Number(set.hold) || 0;
    if (val <= 0) continue;
    const key = set.exerciseId + "|" + set.kind;
    if (!by[key] || val > by[key].best) {
      by[key] = { exerciseId: set.exerciseId, name: set.exerciseName || (EX_BY_ID[set.exerciseId] || {}).name || set.exerciseId, kind: set.kind, best: val, date: session.date, unit: set.kind === "reps" ? "opakování" : "s" };
    }
  }

}
function mostPerformed(p) {
  const map = {};
  for (const { session, set } of sessionSets(p, true)) {
    if (!set.exerciseId) continue;
    const m = map[set.exerciseId] || (map[set.exerciseId] = { name: set.exerciseName || set.exerciseId, sessionIds: new Set(), sets: 0 });
    m.sessionIds.add(session.id);
    m.sets++;
  }
  return Object.values(map).map(m => ({ name: m.name, sessions: m.sessionIds.size, sets: m.sets })).sort((a, b) => b.sessions - a.sessions || b.sets - a.sets).slice(0, 8);
}
function skillProgressByCategory(p) {
  return CAT.skillCategoryOrder.map(cat => {
    const skills = SKILLS.filter(s => s.category === cat);
    return { cat, done: skills.filter(s => p.progress[s.id] === "completed").length, total: skills.length };
  });
}

/* ---------- achievements ---------- */
function achievementMetrics(p) {
  const m = {};
  const t = totals(p);
  const dates = sessionDates(p);
  m.workouts = t.sessions;
  m.scheduled = completedSessions(p).filter(s => s.entryId).length;
  m.sets = t.sets;
  m.reps = t.reps;
  m.hold_seconds = t.hold;
  m.streak_days = streak(p);
  const byWeek = {}, byMonth = {};
  for (const d of dates) {
    const dt = parseISO(d);
    const w = isoOf(mondayOf(dt));
    byWeek[w] = (byWeek[w] || 0) + 1;
    const mo = dt.getFullYear() * 100 + (dt.getMonth() + 1);
    byMonth[mo] = (byMonth[mo] || 0) + 1;
  }
  m.week_best = Math.max(0, ...Object.values(byWeek));
  m.month_best = Math.max(0, ...Object.values(byMonth));
  let weekStreak = 0;
  let w = isoOf(mondayOf(new Date()));
  if ((byWeek[w] || 0) < 3) w = isoOf(addDays(parseISO(w), -7));
  while ((byWeek[w] || 0) >= 3) { weekStreak++; w = isoOf(addDays(parseISO(w), -7)); }
  m.week_streak = weekStreak;
  const done = Object.values(p.progress || {}).filter(x => x === "completed").length;
  m.skills_done = done;
  for (let tier = 0; tier < 4; tier++) m["skills_tier:" + tier] = Object.entries(p.progress || {}).filter(([id, st]) => st === "completed" && (SKILL_BY_ID[id] || {}).tier === tier).length;
  for (const cat of CAT.skillCategoryOrder) m["skills_cat:" + cat] = Object.entries(p.progress || {}).filter(([id, st]) => st === "completed" && (SKILL_BY_ID[id] || {}).category === cat).length;
  for (const s of SKILLS) m["skill:" + s.id] = p.progress[s.id] === "completed" ? 1 : 0;
  const ranks = evaluateRanks(p);
  const rankResults = Object.values(ranks);
  m.prs = Object.keys(bestValues(p)).length;
  m.ranked = rankResults.filter(r => r.rank > 0).length;
  for (let n = 0; n <= CAT.ranks.max; n++) m["ranks_ge:" + n] = rankResults.filter(r => r.rank >= n).length;
  m.level = levelInfo(xpTotal(p)).level;
  m.achievements = Object.values(p.achievements || {}).filter(x => x.unlocked).length;
  m.favorites = (p.favorites || []).length;
  const trained = sessionSets(p, true);
  m.exercises_trained = new Set(trained.map(x => x.set.exerciseId)).size;
  m.categories_trained = new Set(trained.map(x => (EX_BY_ID[x.set.exerciseId] || {}).category).filter(Boolean)).size;
  m.max_hold = Math.max(0, ...trained.filter(x => x.set.kind === "hold").map(x => Number(x.set.hold) || 0));
  const best = bestValues(p);
  for (const e of EXERCISES) m["best:" + e.id] = best[e.id] || 0;
  return m;
}
function syncAchievements(p) {
  const newly = [];
  for (let pass = 0; pass < 8; pass++) {
    const metrics = achievementMetrics(p);
    let changed = false;
    for (const a of ACHIEVEMENTS) {
      const cur = p.achievements[a.id] || { progress: 0, unlocked: null };
      const val = Number(metrics[a.metric]) || 0;
      cur.progress = Math.max(0, val);
      if (!cur.unlocked && val >= Number(a.target)) {
        cur.unlocked = nowISO();
        awardXp(p, "ach:" + a.id, Number(a.xp) || 0, "Úspěch: " + a.name, "achievement");
        newly.push(a);
        changed = true;
      }
      p.achievements[a.id] = cur;
    }
    if (!changed) break;
  }
  return newly;
}
function toastAchievements(list) {
  if (!list || !list.length) return;
  setTimeout(() => {

    showToast("Úspěch: " + a.name + " · +" + a.xp + " XP", "ok");

}
function achievementValue(p, a) {

}
function requirementText(a) {

  } : {

/* ---------- cosmetics ---------- */
function unlockedAvatar(p, a) {
  if (!a || !a.requirement) return true;
  const ach = ACH_BY_NAME[a.requirement];
  if (ach) return !!(p.achievements[ach.id] && p.achievements[ach.id].unlocked);

}
function avatarRequirement(a) {

}
function unlockedCosmetic(p, c) {

  if (c.unlock.type === "achievement") return !!(p.achievements[c.unlock.id] && p.achievements[c.unlock.id].unlocked);

}

/* ---------- workouts ---------- */
function workouts(p) { return (p.workouts || []).slice(); }
function workoutById(p, id) { return (p.workouts || []).find(w => w.id === id); }
function workoutTotalSets(w) { return sum(w.items || [], x => Number(x.sets) || 0); }
function workoutMinutes(w) {
  let sec = 0;
  for (const it of (w.items || [])) {
    const sets = Number(it.sets) || 0;
    const rest = Number(it.rest) || 60;
    sec += sets * (rest + Math.min(60, Number(it.amount) || 10));
  }
  return Math.max(5, Math.round(sec / 60));
}
function makeDraftFromWorkout(w) {
  return {
    id: w.id, name: w.name, description: w.description || "", style: w.style || "strength",
    items: (w.items || []).map(x => ({ exerciseId: x.exerciseId, sets: x.sets, amount: x.amount, rest: x.rest }))
  };
}

}
function createQuickWorkout(p, ex) {

    style: ex.kind === "hold" ? "skill" : "strength", created: nowISO(), updated: nowISO(),
    items: [{ exerciseId: ex.id, sets: Number(ex.default_sets) || 3, amount: Number(ex.default_amount) || 10, rest: Number(ex.default_rest) || 60 }]
  };

/* ---------- sessions ---------- */
function startWorkout(p, w, entryId) {
  if (!w) { showToast("Trénink nenalezen.", "err"); return false; }
  if (p.active) { showToast("Nejdřív dokonči nebo přeruš rozpracovaný trénink.", "err"); return false; }
  const sets = [];
  (w.items || []).forEach(it => {
    const ex = EX_BY_ID[it.exerciseId];
    if (!ex) return;
    const n = Math.max(1, Number(it.sets) || 1);
    for (let i = 1; i <= n; i++) {
      const amount = Math.max(1, Number(it.amount) || Number(ex.default_amount) || 1);
      sets.push({
        key: uid("set"), exerciseId: ex.id, exerciseName: ex.name, kind: ex.kind,
        targetAmount: amount, reps: ex.kind === "reps" ? amount : 0, hold: ex.kind === "hold" ? amount : 0,
        done: false, rest: Math.max(0, Number(it.rest) || Number(ex.default_rest) || 60), setNo: i
      });
    }
  });
  p.active = {
    id: uid("sess"), workoutId: w.id, workoutName: w.name, style: w.style || "strength",
    startedAt: nowISO(), startedMs: Date.now(), entryId: entryId || "", sets
  };
  ui.restUntil = 0; ui.restTotal = 0;
  save();
  go("train", "active");
  return true;
}
function sessionElapsed(s) {
  if (!s) return 0;
  if (s.startedMs) return Math.max(0, Math.floor((Date.now() - s.startedMs) / 1000));
  if (s.startedAt) return Math.max(0, Math.floor((Date.now() - Date.parse(s.startedAt)) / 1000));
  return 0;
}
function sessionDoneCount(s) { return (s.sets || []).filter(x => x.done).length; }
function finishSession(p) {
  const s = p.active;
  if (!s) { showToast("Žádný aktivní trénink.", "err"); return; }
  // make sure latest inputs are stored
  readActiveInputs();
  const done = sessionDoneCount(s);
  if (done <= 0) { showToast("Označ alespoň jednu dokončenou sérii.", "err"); return; }
  const total = s.sets.length;
  const exercisesDone = new Set(s.sets.filter(x => x.done).map(x => x.exerciseId)).size;
  const elapsed = sessionElapsed(s);
  const before = evaluateRanks(p);
  const session = {
    id: s.id, workoutId: s.workoutId, workoutName: s.workoutName, style: s.style,
    date: todayISO(), started: s.startedAt, finished: nowISO(), elapsed,
    entryId: s.entryId || "", xp: 0,
    sets: s.sets.map(x => Object.assign({}, x))
  };
  p.sessions.push(session);
  p.active = null;
  ui.restUntil = 0; ui.restTotal = 0;
  let earned = 0;
  const eligible = elapsed >= (PROG.minSessionSeconds || 120) && done >= Math.floor(total * (PROG.minSetsShare || 0.5));
  if (eligible) {
    const setXp = Math.min(done * (PROG.xpPerSet || 1), PROG.maxSetXp || 15);
    const exXp = Math.min(exercisesDone * (PROG.xpPerExercise || 3), PROG.maxExercisesXp || 8);
    let amt = (PROG.xpWorkout || 25) + setXp + exXp;
    if (session.entryId) amt += PROG.xpScheduled || 15;
    earned += awardXp(p, "workout:" + session.id, amt, "Trénink: " + s.workoutName, "workout", session.date);
  }
  earned += creditRankChanges(p, before);
  const newly = syncAchievements(p);
  session.xp = earned;
  save();
  if (newly.length) toastAchievements(newly);
  if (!eligible) showToast("Trénink uložen. Pro XP je potřeba alespoň 2 minuty a 50 % sérií.", "err");
  go("train", "summary", session.id);
}
function cancelSession(p) {
  if (!p.active) return;
  p.active = null;
  ui.restUntil = 0; ui.restTotal = 0;
  save();
  showToast("Trénink přerušen.");
  go("train", "main");
}

/* ---------- schedule ---------- */
function scheduleEntries(p) { return (p.schedule || []); }
function occurrences(p, startDate, days) {
  startDate = startDate || new Date();
  days = days || 14;
  const out = [];
  const start = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    const date = isoOf(d);
    const wd = (d.getDay() + 6) % 7;
    for (const e of scheduleEntries(p)) {
      const match = e.type === "weekly" ? Number(e.weekday) === wd : e.date === date;
      if (!match) continue;
      if ((p.skips || []).includes(e.id + "@" + date)) continue;
      const done = (p.sessions || []).some(s => s.entryId === e.id && String(s.date).slice(0, 10) === date);
      out.push({
        entry: e, id: e.id, date, isRest: !!e.rest, done,
        workoutId: e.workoutId || "", workoutName: e.workoutId && workoutById(p, e.workoutId) ? workoutById(p, e.workoutId).name : ""
      });
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function todayOccurrences(p) {
  return occurrences(p, new Date(), 1);
}
function skipOccurrence(p, entryId, date) {
  const key = entryId + "@" + date;
  if (!p.skips.includes(key)) p.skips.push(key);
  save();
  showToast("Termín přeskočen.");
}
function deleteScheduleEntry(p, id) {
  p.schedule = (p.schedule || []).filter(e => e.id !== id);
  save();
  showToast("Položka plánu smazána.");
}

/* ---------- profiles ---------- */
function createProfile(slot, name, avatar) {
  slot = Number(slot);
  if (slot < 1 || slot > 3) return false;
  if (state.profiles[slot - 1]) { showToast("Slot je již obsazený.", "err"); return false; }
  const p = newProfile(slot, name || ("Hráč " + slot));
  if (avatar && AVATAR_BY_ID[avatar]) p.avatar = avatar;
  state.profiles[slot - 1] = p;
  state.active = slot;
  save();
  showToast("Profil vytvořen.");
  return true;
}
function switchProfile(slot) {
  slot = Number(slot);
  if (!state.profiles[slot - 1]) { showToast("Nejdřív profil vytvoř.", "err"); return false; }
  state.active = slot;
  ui.restUntil = 0; ui.restTotal = 0;
  save();
  go("home", "main");
  showToast("Přepnuto na " + state.profiles[slot - 1].name);
  return true;
}
function deleteProfile(slot) {
  slot = Number(slot);
  const p = state.profiles[slot - 1];
  if (!p) return false;
  if (state.profiles.filter(Boolean).length <= 1) { showToast("Alespoň jeden profil musí zůstat.", "err"); return false; }
  state.profiles[slot - 1] = null;
  if (state.active === slot) {
    const next = state.profiles.findIndex(Boolean) + 1;
    state.active = next;
  }
  save();
  showToast("Profil smazán.");
  return true;
}

function isEn() {
  return !!(state && state.prefs && state.prefs.lang === "en");
}

function replacePhrase(text, from, to) {
  const escaped = from.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try {
    return text.replace(new RegExp("(?<![\\p{L}\\p{N}_])" + escaped + "(?![\\p{L}\\p{N}_])", "gu"), to);
  } catch (e) {
    return text.split(from).join(to);
  }
}

function tr(value) {
  if (!isEn() || value == null) return value;
  const raw = String(value);
  const lead = (raw.match(/^\s*/) || [""])[0];
  const trail = (raw.match(/\s*$/) || [""])[0];
  const core = raw.slice(lead.length, raw.length - trail.length);
  if (!core) return raw;
  // Never rewrite a player's own name, even if it happens to match a label.
  if (state.profiles && state.profiles.some(p => p && p.name === core)) return raw;
  // Dictionary keys sometimes include the surrounding space (e.g. a label
  // followed by an inline <b> element). Try the raw node first, then the
  // whitespace-trimmed core so both cases work.
  let out = I18N_EN[raw];
  if (out == null) out = I18N_EN[core];
  if (out == null && trail) out = I18N_EN[core + trail];
  if (out == null && lead) out = I18N_EN[lead + core];
  if (out == null) {
    for (const [re, replacement] of I18N_PATTERNS) {
      if (re.test(core)) { out = core.replace(re, replacement); break; }
    }
  }
  if (out == null) out = core;
  // Patterns often translate the sentence shell but leave a Czech unit or
  // noun inside (e.g. "No rank · 0 opakování · untested"). Run the phrase
  // pass on the result as well so those mixed strings are fully translated.
  for (const [from, to] of I18N_PHRASES) out = replacePhrase(out, from, to);
  if (out === core) out = null;
  return out == null ? raw : lead + out + trail;
}

function translateDom(root) {
  if (!root || !isEn()) return;
  const skip = el => {
    if (!el || !el.tagName) return true;
    if (/^(SCRIPT|STYLE|TEXTAREA)$/i.test(el.tagName)) return true;
    return !!(el.closest && el.closest('[data-i18n="off"]'));
  };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (skip(node.parentElement)) return NodeFilter.FILTER_REJECT;
      return node.nodeValue && node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const next = tr(node.nodeValue);
    if (next !== node.nodeValue) node.nodeValue = next;
  }
  root.querySelectorAll("[placeholder],[title],[aria-label],[alt]").forEach(el => {
    if (skip(el)) return;
    for (const attr of ["placeholder", "title", "aria-label", "alt"]) {
      if (!el.hasAttribute(attr)) continue;
      const next = tr(el.getAttribute(attr));
      if (next !== el.getAttribute(attr)) el.setAttribute(attr, next);
    }
  });
}

function onboardingStep() {
  return clamp(Number(ui.onboardingStep) || 0, 0, 3);
}

function recommendedFirstWorkout(p) {
  const examples = (p.workouts || []).filter(w => w.example);
  const pick = name => examples.find(w => String(w.name).toLowerCase() === name.toLowerCase());
  const goal = state.prefs.goal || "strength";
  let w = null;
  if (goal === "skills") w = pick("Skill Training");
  else if (goal === "endurance") w = pick("Cardio");
  else if (goal === "habit") w = pick("Push Day");
  else w = pick("Push Day") || pick("Pull Day");
  return w || examples[0] || (p.workouts || [])[0] || null;
}
